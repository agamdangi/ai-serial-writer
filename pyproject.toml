[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "serial-writer"
version = "0.1.0"
description = "Agentic Serial Story Writer using Gemini Free Tier"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "google-genai>=0.1.0,<1.0.0",
    "typer[all]>=0.9.0,<1.0.0",
    "rich>=13.0.0,<14.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0,<9.0.0",
]

[project.scripts]
serial-writer = "serial_writer.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["serial_writer*"]
